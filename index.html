<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEMM · HBM → L2 → SMs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="viewport"></div>
    <div id="hud">
      <header class="top">
        <div class="identity">
          <p class="eyebrow" id="eyebrow">FP32 GEMM</p>
          <h1>HBM → L2 → SMs</h1>
          <div class="legend" aria-hidden="true">
            <span><i class="swatch hw"></i>hardware</span>
            <span><i class="swatch a"></i>A</span>
            <span><i class="swatch b"></i>B</span>
            <span><i class="swatch c"></i>C</span>
          </div>
          <p class="keyline">Metal is the GPU. Color is the GEMM.</p>
        </div>
        <div class="phase">
          <p id="phase-kicker" class="eyebrow">0:00</p>
          <h2 id="phase-title">Architecture</h2>
          <p id="phase-body"></p>
        </div>
      </header>

      <section class="meters" aria-label="Where the matrices live">
        <label class="meter a">
          <span>A</span>
          <b id="a-status"></b>
          <i><em id="a-bar"></em></i>
        </label>
        <label class="meter b">
          <span>B</span>
          <b id="b-status"></b>
          <i><em id="b-bar"></em></i>
        </label>
        <label class="meter c">
          <span>C</span>
          <b id="c-status"></b>
          <i><em id="c-bar"></em></i>
        </label>
      </section>

      <aside id="inspect" hidden>
        <p class="eyebrow">Inspection window</p>
        <h3 id="inspect-title">SM</h3>
        <p id="inspect-state"></p>
        <dl id="inspect-facts"></dl>
        <p id="inspect-note"></p>
        <button id="inspect-back" type="button">Back to demo</button>
      </aside>

      <footer class="transport">
        <button id="play" type="button" aria-label="Play">Play</button>
        <div class="scrub-wrap">
          <div id="marks" class="marks"></div>
          <input id="scrub" type="range" min="0" max="22" step="0.01" value="0" aria-label="Timeline" />
        </div>
        <span id="clock">0:00.0</span>
        <button id="follow" type="button" hidden>Follow</button>
      </footer>
      <p class="hint">Space play · ← → scrub · drag orbits · click an SM</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
